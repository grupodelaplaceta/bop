<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exportar PDF — BOLP</title>
  <link rel="icon" type="image/png" href="img/favibop.png">
  <link rel="stylesheet" href="css/bop.css">
</head>
<body>
  <header class="bop-header">
    <img class="logo" src="img/boplogo.png" alt="BOLP">
    <div class="marca">
      <h1><span class="bop-acronimo">BOLP</span> · Boletín Oficial de La Placeta</h1>
      <span>Exportación PDF</span>
    </div>
    <div class="buscador-global" role="search">
      <span class="sg-icono">🔍</span>
      <input type="search" id="buscadorGlobalInput" placeholder="Buscar normativa…" autocomplete="off" aria-label="Buscar normativa">
      <div class="buscador-global-dropdown" id="buscadorGlobalResultados" hidden></div>
    </div>
    <button type="button" class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav id="navPrincipal">
      <a href="index.html">Inicio</a>
      <a href="normativa.html">Normativa</a>
      <a href="cnic.html">Datos (CNIC)</a>
    </nav>
  </header>

  <main class="container" id="cuerpo">
    <div class="cargando">Generando PDF…</div>
  </main>

  <footer class="bop-footer">Boletín Oficial de La Placeta · Grupo de La Placeta</footer>

  <script src="js/datos-migrados.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/bop.js"></script>
  <script src="js/bop-nav.js"></script>
  <!-- Impresión por navegador: sin dependencias externas -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await BOP.init();
      const params = new URLSearchParams(location.search);
      const codigo = (params.get('codigo') || params.get('cnic') || '').toUpperCase();
      const cuerpo = document.getElementById('cuerpo');
      if (!codigo) {
        cuerpo.innerHTML = '<div class="aviso aviso-error">Parámetro de documento no especificado.</div>';
        return;
      }
      const d = BOP.getDocumento(codigo);
      const c = BOP.getCnicPorCodigo(codigo);
      const item = d || c;
      if (!item) {
        cuerpo.innerHTML = '<div class="aviso aviso-error">Documento no encontrado.</div>';
        return;
      }
      const esCnic = !!c;
      cuerpo.innerHTML = `
        <div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--bop-acento);padding-bottom:14px;margin-bottom:20px">
          <img src="img/boplogo.png" style="height:52px;background:#fff;border-radius:8px;padding:4px" alt="BOP">
          <div>
            <div style="font-weight:800;font-size:20px;color:var(--bop-acento)">Boletín Oficial de La Placeta</div>
            <div style="font-size:12px;color:var(--bop-texto-suave)">Grupo de La Placeta · bop.laplaceta.org · ${new Date().toLocaleDateString('es-ES')}</div>
          </div>
        </div>
        ${esCnic ? `
          <h1 style="font-size:22px;color:var(--bop-acento)">${bopEscapeHtml(c.codigo)} — ${bopEscapeHtml(c.etiqueta)}</h1>
          <p style="color:var(--bop-texto-suave)">${bopEscapeHtml(c.descripcion || '')}</p>
          <div style="background:var(--bop-acento-claro);border-radius:10px;padding:16px;margin:16px 0;font-size:20px;font-weight:800;color:var(--bop-acento)">
            ${bopEscapeHtml(c.valor)} ${bopEscapeHtml(c.unidad || '')}
          </div>
          <p style="font-size:12px;color:var(--bop-texto-suave)">${bopEscapeHtml(c.articulo || '')} · ${bopEscapeHtml(c.tipo_valor || 'texto')}</p>
        ` : `
          <h1 style="font-size:22px;color:var(--bop-acento)">${bopEscapeHtml(d.codigo)} — ${bopEscapeHtml(d.titulo)}</h1>
          <p style="font-size:12px;color:var(--bop-texto-suave)">
            Estado: ${bopEscapeHtml(d.estado || '')} · Aplicación: ${bopEscapeHtml(d.fecha_aplicacion || '—')}
            ${d.fecha_aprobacion_junta ? ' · Junta: ' + bopEscapeHtml(d.fecha_aprobacion_junta) : ''}
            · Versión: ${bopEscapeHtml(d.version || 1)}
          </p>
          <div style="font-size:13.5px;line-height:1.75">${bopRenderMarkdown(d.contenido_md)}</div>
        `}
        <div style="margin-top:30px;border-top:1px solid var(--bop-borde);padding-top:12px;font-size:11px;color:var(--bop-texto-suave)">
          Documento oficial del Boletín Oficial de La Placeta. Verifíquese en bop.laplaceta.org.
        </div>
        <div style="margin-top:20px;display:flex;gap:10px">
          <button class="btn btn-secundario" onclick="history.back()">← Volver</button>
          <button class="btn btn-primario" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
        </div>
      `;
      window.print();
    });
  </script>
</body>
</html>
