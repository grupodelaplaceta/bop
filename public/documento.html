<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento — BOLP</title>
  <link rel="icon" type="image/png" href="img/favibop.png">
  <link rel="stylesheet" href="css/bop.css">
  <link rel="stylesheet" href="css/bolp-oficial.css">
</head>
<body>
  <header class="bop-header">
    <div class="mast-top"><span>Grupo de La Placeta</span><span id="mastFecha"></span></div>
    <div class="mast-head">
      <img class="logo" src="img/boplogo.png" alt="BOLP">
      <div class="mast-marca">
        <div class="mast-line1">Boletín Oficial</div>
        <div class="mast-line2">de La Placeta</div>
        <div class="mast-sub">bop.laplaceta.org · Grupo de La Placeta</div>
      </div>
      <div class="buscador-global" role="search">
        <input type="search" id="buscadorGlobalInput" placeholder="Buscar en el boletín…" autocomplete="off" aria-label="Buscar en el boletín">
        <div class="buscador-global-dropdown" id="buscadorGlobalResultados" hidden></div>
      </div>
      <button type="button" class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    </div>
    <nav id="navPrincipal">
      <a href="index.html">Inicio</a>
      <a href="normativa.html">Normativa</a>
      <a href="cnic.html">Datos variables</a>
    </nav>
  </header>

  <main class="container">
    <nav class="migas" id="migas" aria-label="Migas de pan"></nav>
    <div id="contenido" class="cargando">Cargando documento…</div>
  </main>

  <footer class="bop-footer">Boletín Oficial de La Placeta · Grupo de La Placeta</footer>

  <script src="js/datos-migrados.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/bop.js"></script>
  <script src="js/bolp-clasificacion.js"></script>
  <script src="js/bolp.js"></script>
  <script src="js/bop-nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await BOP.init();
      const params = new URLSearchParams(location.search);
      const codigo = (params.get('codigo') || '').toUpperCase();
      const d = BOP.getDocumento(codigo);
      const cont = document.getElementById('contenido');
      const migas = document.getElementById('migas');

      if (!d) {
        cont.className = '';
        migas.innerHTML = `<a href="index.html">Inicio</a> / <a href="normativa.html">Normativa</a>`;
        cont.innerHTML = '<div class="aviso aviso-error">Documento no encontrado.</div><p style="margin-top:12px"><a class="btn btn-primario" href="normativa.html">← Explorar el catálogo de normativa</a></p>';
        return;
      }

      const cl = BOLP.clasificar(d);
      const sec = cl.seccion ? BOLP.seccion(cl.seccion) : null;
      migas.innerHTML = `<a href="index.html">Inicio</a> / <a href="normativa.html${sec ? '?seccion=' + sec.id : ''}">Normativa</a>` +
        (sec ? ` / <a href="normativa.html?seccion=${sec.id}">${sec.numero}. ${bopEscapeHtml(sec.titulo)}</a>` : '') +
        ` / <b>${bopEscapeHtml(d.codigo)}</b>`;

      // CNIC vinculados → tabla de datos
      const cnicVinculados = (d.cnic_refs || []).map(r => {
        const rcod = String(r.codigo || '').toUpperCase();
        const c = BOP.getCnicPorCodigo(rcod);
        if (!c) return '';
        return `<tr><td><a href="cnic.html?codigo=${encodeURIComponent(rcod)}">${bopEscapeHtml(rcod)}</a></td><td>${bopEscapeHtml(c.etiqueta)}</td><td class="cnic-valor"><strong>${bopEscapeHtml(c.valor)}</strong> ${bopEscapeHtml(c.unidad || '')}</td><td>${bopEscapeHtml(c.articulo || '—')}</td></tr>`;
      }).filter(Boolean).join('');
      const tablaCnic = cnicVinculados ? `
        <div style="margin:18px 0 4px">
          <div class="seccion-titulo">Datos variables vinculados (CNIC)</div>
          <table class="tabla"><thead><tr><th>Código</th><th>Etiqueta</th><th>Valor</th><th>Artículo</th></tr></thead><tbody>${cnicVinculados}</tbody></table>
          <p style="font-size:11px;color:var(--bop-texto-suave);margin-top:6px">Valores variables gestionados en los CNIC del BOLP. Se actualizan sin modificar este documento.</p>
        </div>` : '';

      cont.className = '';
      cont.innerHTML = `
        <div class="ficha-acciones">
          <button class="btn btn-secundario" onclick="history.back()">Volver</button>
          <button class="btn btn-primario" onclick="exportarPdf('${encodeURIComponent(d.codigo)}')">Descargar PDF</button>
          <button class="btn btn-outline" onclick="window.print()">Imprimir</button>
        </div>

        <div class="ficha-cab">
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            ${bolpSeccionBadge(d)} ${bolpFamiliaBadge(d)} ${bolpEstadoBadge(d)}
            ${d.version ? `<span class="badge badge-enmienda">v${d.version}</span>` : ''}
          </div>
          <div class="ficha-codigo-linea" style="margin-top:10px">${bopEscapeHtml(d.codigo)}</div>
          <h1 class="ficha-titulo">${bopEscapeHtml(d.titulo)}</h1>
          <div class="ficha-grid">${bolpFichaMetadatos(d)}</div>
        </div>

        ${bolpNavVersion(d, BOP._docs)}

        <div class="documento">
          ${bopRenderMarkdown(d.contenido_md)}
          ${tablaCnic}
        </div>

        <div class="seccion mt-16" id="seccion-cambios">
          <div class="seccion-titulo">Cambios de esta versión</div>
          <div class="leyenda-diff">
            <span><i class="swatch-add"></i> Añadido</span>
            <span><i class="swatch-del"></i> Eliminado</span>
          </div>
          <div id="cambios">${bolpCambiosVersionHtml(d)}</div>
        </div>

        <div class="seccion mt-16" id="seccion-historial">
          <div class="seccion-titulo">Historial de versiones</div>
          <p style="color:var(--bop-texto-suave);font-size:12px;margin:-6px 0 8px">Cada versión archivada permanece accesible. Ninguna se elimina.</p>
          <div id="historial">${bolpHistorialHtml(d)}</div>
        </div>
      `;
    });

    function exportarPdf(codigoEnc) {
      window.open('exportar.html?codigo=' + codigoEnc, '_blank');
    }
  </script>
</body>
</html>
